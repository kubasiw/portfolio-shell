services:
  traefik:
    # v3.1 negocjuje wersję API Dockera na sztywno jako 1.24 — Docker 29+ tego już nie akceptuje
    # (wymaga min. 1.44), więc Traefik nie widział żadnych kontenerów. v3.6.1+ negocjuje wersję
    # automatycznie. Zweryfikowane na żywo 2026-07-24 (błąd "client version 1.24 is too old"
    # w logach), aktualna stabilna wersja w tym momencie: v3.7.8.
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=kubsiw@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - web

networks:
  web:
    name: web

volumes:
  letsencrypt:

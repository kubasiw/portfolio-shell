server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — wszystkie nieznane ścieżki wracają do index.html,
    # routing po stronie klienta (React Router w przyszłości) go przejmuje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

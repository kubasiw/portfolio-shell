server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nagłówki bezpieczeństwa — sprawdzone na żywo (performance.getEntriesByType('resource')),
    # jakie originy strona faktycznie kontaktuje: kubsiw.com (siebie), tourguide.kubsiw.com
    # (widget mapy — skrypt + jego własne API), kafle OpenStreetMap. Build portfolio-shellu sam
    # nie ma żadnych inline <script>/<style> — ale osadzony <tour-guide-mini-map> (Angular custom
    # element z ViewEncapsulation.ShadowDom) wstrzykuje SWOJE style jako prawdziwe <style> wewnątrz
    # własnego shadow roota, nie przez zewnętrzny plik CSS. CSP dotyczy całego dokumentu, więc
    # style-src bez 'unsafe-inline' po cichu blokowało te reguły (element <style> zostawał w DOM,
    # ale przeglądarka nie stosowała żadnej z jego reguł) — realny bug złapany dopiero na
    # kubsiw.com (Vite dev server nie wysyła CSP wcale, więc lokalnie nic tego nie ujawniało):
    # `.leaflet-container` traciło swoje `overflow: hidden`, kontener rósł bez ograniczeń w pętli
    # ResizeObserver → invalidateSize → więcej kafli → większy kontener, aż zawieszało kartę.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://tourguide.kubsiw.com; connect-src 'self' https://tourguide.kubsiw.com; img-src 'self' https://tourguide.kubsiw.com https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # SPA fallback — wszystkie nieznane ścieżki wracają do index.html,
    # routing po stronie klienta (React Router w przyszłości) go przejmuje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
